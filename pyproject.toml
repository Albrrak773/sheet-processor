[project]
name = "sheet-processor"
version = "0.1.0"
description = "A service to validate and process Google Sheets data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "fastapi-cli>=0.0.7",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "aiomysql>=0.2.0",
    "cryptography>=44.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.22.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = false
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
