services:
  mysql:
    image: mysql:8.0
    container_name: sheet-processor-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sheet_processor
      MYSQL_USER: sheetuser
      MYSQL_PASSWORD: sheetpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
