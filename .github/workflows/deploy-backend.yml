name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.INFISICLA_VPS_HOST }}
          username: ${{ secrets.INFISICLA_VPS_USER }}
          key: ${{ secrets.INFISICLA_GITHUB_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            # Install Infisical CLI if not present
            if ! command -v infisical &> /dev/null; then
              curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
              sudo apt-get update -y
              sudo apt-get install -y infisical
            fi

            # Install uv if not present
            if ! command -v uv &> /dev/null; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
            fi

            # Clone or update repository
            if [ -d "$HOME/sheet-processor" ]; then
              cd "$HOME/sheet-processor"
              git fetch origin
              git reset --hard origin/main
            else
              git clone https://github.com/Albrrak773/sheet-processor.git "$HOME/sheet-processor"
              cd "$HOME/sheet-processor"
            fi

            # Remove frontend directory
            rm -rf "$HOME/sheet-processor/frontend"

            # Change to backend directory
            cd "$HOME/sheet-processor/backend"

            # Source Infisical credentials
            source /etc/infisical/prod.env

            # Login and get token
            INFISICAL_TOKEN="$(
              infisical login \
                --method=$INFISICAL_AUTH_METHOD \
                --client-id="$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
                --client-secret="$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" \
                --plain --silent
            )"
            export INFISICAL_TOKEN

            # Create virtual environment with Python 3.13
            uv venv --python 3.13

            # Install dependencies
            uv sync

            # Stop existing PM2 process if running
            pm2 stop sheet-processor 2>/dev/null || true
            pm2 delete sheet-processor 2>/dev/null || true

            # Start the application with PM2 (pass token inline for the subprocess)
            pm2 start "INFISICAL_TOKEN=$INFISICAL_TOKEN infisical run --env production -- uv run prod.py" --name sheet-processor --time

            # Save PM2 configuration
            pm2 save
